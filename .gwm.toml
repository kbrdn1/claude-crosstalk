# gwm — worktree bootstrap for claude-crosstalk (Claude Mod, TypeScript)
#
# Placeholders supported in paths/patterns: {repo} {home} {repo_path}
# {repo_parent} {type} {issue} {desc}. {repo_parent} = the dir containing the
# repo. `base = "{repo_parent}/worktrees/{repo}"` keeps every worktree under
# <repo_parent>/worktrees/<repo>/…, mirroring Zed's default
# git.worktree_directory = "../worktrees".
# Docs: https://github.com/kbrdn1/claude-crosstalk

[worktree]
base           = "{repo_parent}/worktrees/{repo}"
path_pattern   = "{type}-{issue}-{desc}"
branch_pattern = "{type}/#{issue}-{desc}"

# -- direnv activation -------------------------------------------------------
# If the repo ever grows an `.envrc`, allow it on bootstrap. No-ops otherwise.
[[bootstrap.command]]
name = "direnv allow"
run  = "direnv allow ."
when = "file_exists:.envrc"

# -- TUI `R: review` launcher ------------------------------------------------
[review]
tool = "lumen"

# -- TUI macros --------------------------------------------------------------
# Run in the selected worktree's directory:
#   h → the mod's tests
#   H → install this worktree's crosstalk into Claude Code
[tui.macro1]
command = "make test"

[tui.macro2]
command = "make install"

# ── exec profiles for the TUI overlay (x) ────────────────────────────────────
[exec.profiles.ci]
command = ["make", "ci"]
[exec.profiles.test]
command = ["make", "test"]
[exec.profiles.typecheck]
command = ["make", "typecheck"]
[exec.profiles.validate]
command = ["make", "validate"]
